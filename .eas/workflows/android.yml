name: قرآن (تسبيع) – Android install file

# For the day this folder lives in its own repository with its own Expo project:
# pushing to this branch builds the shareable install file (.apk).
on:
  push:
    branches: ['build/android']

jobs:
  build_android:
    name: Build Android (install file)
    type: build
    params:
      platform: android
      profile: preview
